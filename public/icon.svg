<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#2a3b5c" stroke-width="6" opacity="0.6" />

  <!-- Grid lines -->
  <path d="M 64 256 L 448 256" stroke="#1c2840" stroke-width="3" stroke-dasharray="6,6" />
  <path d="M 256 64 L 256 448" stroke="#1c2840" stroke-width="3" stroke-dasharray="6,6" />

  <!-- Payoff Curve / Volatility Cone Geometry -->
  <path d="M 80 380 L 210 380 L 320 150 L 432 150" fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Strike Point Target Pulse -->
  <circle cx="265" cy="265" r="42" fill="none" stroke="url(#amberGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="265" cy="265" r="14" fill="#ffb703" />

  <!-- Reticle Crosshairs -->
  <line x1="265" y1="190" x2="265" y2="215" stroke="#ffb703" stroke-width="6" stroke-linecap="round" />
  <line x1="265" y1="315" x2="265" y2="340" stroke="#ffb703" stroke-width="6" stroke-linecap="round" />
  <line x1="190" y1="265" x2="215" y2="265" stroke="#ffb703" stroke-width="6" stroke-linecap="round" />
  <line x1="315" y1="265" x2="340" y2="265" stroke="#ffb703" stroke-width="6" stroke-linecap="round" />

  <!-- Candlesticks Accents -->
  <g opacity="0.85">
    <!-- Bullish candle -->
    <line x1="130" y1="200" x2="130" y2="320" stroke="#00e676" stroke-width="4" stroke-linecap="round" />
    <rect x="120" y="220" width="20" height="70" rx="3" fill="#00e676" />

    <!-- Bearish candle -->
    <line x1="390" y1="180" x2="390" y2="300" stroke="#ff334b" stroke-width="4" stroke-linecap="round" />
    <rect x="380" y="210" width="20" height="60" rx="3" fill="#ff334b" />
  </g>

  <!-- Brand Typography Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    STRIKE<tspan fill="#ffb703">POINT</tspan>
  </text>
</svg>
